<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TikTok Downloader</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/floating.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" id="brandIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
        </div>
        <span class="brand-title">Downloader</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnCheckUpdate" aria-label="Actualizar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="icon-btn" id="btnToggleHistory" aria-label="Historial">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button class="icon-btn" id="btnSettings" aria-label="Configuración">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="input-box">
      <input type="url" id="urlInput" class="url-input" placeholder="Enlace de TikTok..." autocomplete="off" spellcheck="false">
      <button class="btn-paste" id="btnPaste" aria-label="Pegar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      </button>
      <button class="btn-submit" id="btnSubmit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>

    <div class="loader-container" id="loader">
      <div class="spinner"></div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="author-bar">
        <img id="authorAvatar" class="author-avatar" alt="">
        <div class="author-meta">
          <span id="authorName" class="author-name"></span>
          <span id="authorId" class="author-id"></span>
        </div>
      </div>

      <div class="card-caption" id="cardCaption"></div>

      <div class="media-viewer" id="mediaViewer">
        <div class="badge" id="mediaBadge" style="display: none;"></div>
        <div class="media-content" id="mediaContent"></div>
      </div>

      <div class="action-bar" id="actionBar"></div>
    </div>

    <section class="history-panel" id="historyPanel" style="display: none;">
      <div class="history-header">
        <span class="history-title">Recientes</span>
        <button class="icon-btn" id="btnClearHistory" aria-label="Limpiar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  <div class="modal-backdrop" id="settingsModal" style="display: none;">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Configuración</span>
        <button class="icon-btn" id="btnCloseSettings" aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="setting-item">
        <span class="setting-label">Botón flotante</span>
        <label class="switch">
          <input type="checkbox" id="chkFloating">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <span class="setting-label">Modo experimental</span>
        <label class="switch">
          <input type="checkbox" id="chkExperimental">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="bundle.js"></script>
</body>
</html>
